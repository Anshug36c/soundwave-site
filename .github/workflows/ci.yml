name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Unit tests · Build · Browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit, strict)
        run: npm run typecheck

      - name: Unit tests (Vitest — ported algorithms)
        run: npm test

      - name: Build (Vite production bundle)
        run: npm run build

      - name: Install Playwright Chromium + system deps
        run: npx playwright install --with-deps chromium

      - name: Generate audio fixtures
        run: npm run fixtures

      - name: Browser smoke tests (library playback, engine, phone bridge)
        run: npm run smoke:serve
        env:
          SMOKE_AUDIO_DIR: ${{ github.workspace }}/.fixtures/audio

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 7
